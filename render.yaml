services:
  - type: web
    name: drathaismaltempi-triage
    env: python
    buildCommand: pip install --no-deps -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRIAGE_CORS_ORIGINS
        value: https://www.drathaismaltempi.com.br
      - key: OPENAI_API_KEY
        sync: false
      - key: TRIAGE_API_TOKEN
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        value: drathaispreconsulta@gmail.com
      - key: PHYSICIAN_EMAIL_TO
        value: drathaismaltempi@outlook.com
      - key: TRIAGE_LOG_DB_PATH
        value: data/triage_logs.db
      - key: TRIAGE_UPLOAD_DIR
        value: data/uploads